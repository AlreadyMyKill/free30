name: Deploy GitHub Pages

# Nasadí obsah repozitáře na GitHub Pages. Díky `enablement: true` si Pages
# zapne samo, takže není potřeba nic klikat v Settings → Pages (což mobilní
# aplikace GitHubu stejně neumí).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Souběžná nasazení se nepřepisují navzájem; rozdělaný deploy se dokončí.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
