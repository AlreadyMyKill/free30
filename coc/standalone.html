<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="theme-color" content="#100f0c" />
<title>Village Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
<style>
/* =========================================================================
 * app.css — Clash of Clans Village Planner
 * ========================================================================= */

:root {
  /* teplé neutrály posunuté ke zlaté – kámen a zlato, ne modrošedá */
  --bg: #100f0c;
  --bg-2: #16140f;
  --panel: #1b1913;
  --panel-2: #221f18;
  --line: #322e24;
  --text: #f1ede4;
  --muted: #a49c8a;
  --dim: #7b7362;

  --gold: #e8a91f;
  --gold-2: #ffd166;

  /* sémantické barvy stavu – vědomě oddělené od akcentu */
  --good: #4fb87a;
  --okay: #9fc45a;
  --warn: #e8823d;
  --bad: #e0554f;
  --info: #5aa9d6;

  --display: Archivo, "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --radius: 14px;
  --radius-s: 9px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(1100px 550px at 12% -12%, #241f14 0%, transparent 62%),
    radial-gradient(900px 500px at 92% -4%, #2b2013 0%, transparent 58%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
}

a { color: var(--gold-2); }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 80px; }

/* ---------- hlavička ---------- */
.top {
  position: sticky; top: 0; z-index: 50;
  background: rgba(16, 15, 12, .93);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; letter-spacing: -.2px; }
.brand .logo { font-size: 24px; filter: drop-shadow(0 2px 6px rgba(232,169,31,.5)); }
.brand small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); letter-spacing: .3px; }
.top .spacer { flex: 1; }

.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0; scrollbar-width: thin; }
.tab {
  border: 1px solid transparent; background: transparent; color: var(--muted);
  padding: 7px 13px; border-radius: 999px; cursor: pointer; font-size: 13.5px;
  white-space: nowrap; font-weight: 600; transition: .15s;
}
.tab:hover { color: var(--text); background: var(--panel); }
.tab.active { color: #1a1200; background: linear-gradient(180deg, var(--gold-2), var(--gold)); border-color: #b8860f; }

/* ---------- obecné ---------- */
.card {
  background: linear-gradient(180deg, var(--panel), var(--panel-2));
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow);
}
.card + .card { margin-top: 16px; }
.card h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: -.15px; text-wrap: balance; }
.card h3 { margin: 18px 0 8px; font-size: 14.5px; color: var(--gold-2); text-transform: uppercase; letter-spacing: .8px; }
.card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }

.grid { display: grid; gap: 14px; }
.grid.c2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid.c3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.grid.c4 { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }

.section { margin-top: 20px; }
.hide { display: none !important; }

button, .btn {
  font: inherit; font-weight: 600; cursor: pointer;
  border-radius: var(--radius-s); border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); padding: 9px 14px; transition: .15s;
}
button:hover, .btn:hover { border-color: var(--gold); color: var(--gold-2); }
button.primary {
  background: linear-gradient(180deg, var(--gold-2), var(--gold));
  color: #1a1200; border-color: #b8860f;
}
button.primary:hover { filter: brightness(1.08); color: #1a1200; }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }

textarea, select, input[type=text] {
  font: inherit; width: 100%; color: var(--text);
  background: #0c0b08; border: 1px solid var(--line); border-radius: var(--radius-s);
  padding: 10px 12px;
}
textarea { font-family: var(--mono); font-size: 12.5px; min-height: 190px; resize: vertical; }
textarea:focus, select:focus { outline: 2px solid rgba(232,169,31,.4); border-color: var(--gold); }

/* ---------- dropzone ---------- */
.drop {
  border: 2px dashed var(--line); border-radius: var(--radius);
  padding: 26px; text-align: center; color: var(--muted); transition: .15s;
  background: rgba(255,255,255,.015);
}
.drop.over { border-color: var(--gold); background: rgba(232,169,31,.08); color: var(--gold-2); }
.drop strong { color: var(--text); display: block; font-size: 15px; margin-bottom: 4px; }

/* ---------- statistiky ---------- */
.stat {
  background: rgba(255,255,255,.03); border: 1px solid var(--line);
  border-radius: var(--radius-s); padding: 12px 14px;
}
.stat .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; }
.stat .v { font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1.25; font-variant-numeric: tabular-nums; }
.stat .n { font-size: 12px; color: var(--muted); }

/* ---------- progress bary ---------- */
.bar { height: 9px; border-radius: 99px; background: #0c0b08; border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold-2)); }
.bar.good > i { background: linear-gradient(90deg, #2d8f5c, var(--good)); }
.bar.okay > i { background: linear-gradient(90deg, #6d9433, var(--okay)); }
.bar.warn > i { background: linear-gradient(90deg, #a85a22, var(--warn)); }
.bar.bad  > i { background: linear-gradient(90deg, #9c3a35, var(--bad)); }
.bar.thin { height: 6px; }

.rowbar { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; margin-bottom: 11px; }
.rowbar .lbl { font-size: 13.5px; }
.rowbar .val { font-size: 12.5px; color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.rowbar .bar { grid-column: 1 / -1; }

/* ---------- verdikt rushe ---------- */
.verdict { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.dial {
  --p: 0; --c: var(--gold);
  width: 128px; height: 128px; border-radius: 50%; flex: 0 0 auto;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), #262218 0);
  display: grid; place-items: center; position: relative;
}
.dial::after {
  content: ""; position: absolute; inset: 11px; border-radius: 50%;
  background: var(--panel); border: 1px solid var(--line);
}
.dial .in { position: relative; z-index: 1; text-align: center; }
.dial .in b { font-family: var(--display); font-size: 26px; display: block; line-height: 1; font-variant-numeric: tabular-nums; }
.dial .in span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }

.pill {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; border: 1px solid;
}
.pill.good { color: var(--good); border-color: rgba(79,184,122,.42); background: rgba(79,184,122,.11); }
.pill.okay { color: var(--okay); border-color: rgba(159,196,90,.42); background: rgba(159,196,90,.11); }
.pill.warn { color: var(--warn); border-color: rgba(232,130,61,.42); background: rgba(232,130,61,.11); }
.pill.bad  { color: var(--bad);  border-color: rgba(224,85,79,.42); background: rgba(224,85,79,.11); }
.pill.info { color: var(--info); border-color: rgba(90,169,214,.42); background: rgba(90,169,214,.11); }
.pill.muted{ color: var(--muted); border-color: var(--line); background: rgba(255,255,255,.03); }

/* ---------- hlášky ---------- */
.note {
  border-left: 3px solid var(--line); background: rgba(255,255,255,.03);
  padding: 10px 13px; border-radius: 0 var(--radius-s) var(--radius-s) 0;
  margin-bottom: 9px; font-size: 13.5px;
}
.note.good { border-color: var(--good); }
.note.warn { border-color: var(--warn); }
.note.bad  { border-color: var(--bad); }
.note.info { border-color: var(--info); }

/* ---------- výběr strategie ---------- */
.strats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); }
.strat {
  text-align: left; padding: 14px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--panel-2); cursor: pointer;
  display: block; width: 100%; transition: .15s;
}
.strat:hover { transform: translateY(-2px); }
.strat .n { font-family: var(--display); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.strat .n .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
.strat .t { font-size: 12px; color: var(--muted); margin-top: 2px; }
.strat .d { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.strat.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset, var(--shadow); background: #2a251a; }

/* ---------- tabulky / seznamy ---------- */
.list { display: flex; flex-direction: column; gap: 7px; }
.item {
  display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center;
  background: rgba(255,255,255,.025); border: 1px solid var(--line);
  border-radius: var(--radius-s); padding: 9px 12px;
}
.item .ic { font-size: 17px; text-align: center; }
.item .nm { font-weight: 650; font-size: 14px; }
.item .rs { font-size: 12px; color: var(--muted); }
.item .rt { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
.item .rt b { color: var(--gold-2); font-size: 14px; }
.item.behind { border-color: rgba(224,85,79,.38); background: rgba(224,85,79,.07); }

.ord {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--gold); color: #1a1200; font-size: 12px; font-weight: 800;
}

table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th, table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
table.t th { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; font-weight: 700; }
table.t td.num, table.t th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.t tr:hover td { background: rgba(255,255,255,.025); }

.tag { font-size: 11px; color: var(--dim); font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.right { text-align: right; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty .big { font-size: 42px; margin-bottom: 10px; }

/* ---------- responsivita ---------- */
@media (max-width: 640px) {
  .top-in { gap: 8px; }
  .brand small { display: none; }
  .card { padding: 14px; }
  .dial { width: 104px; height: 104px; }
  .item { grid-template-columns: 26px 1fr; }
  .item .rt { grid-column: 1 / -1; text-align: left; }
}

@media print {
  body { background: #fff; color: #000; }
  .top, .no-print { display: none !important; }
  .card { break-inside: avoid; border-color: #ccc; box-shadow: none; background: #fff; color: #000; }
}

/* ---------- přístupnost ---------- */
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  html { scroll-behavior: auto; }
}
/* široký obsah roluje sám v sobě, stránka nikdy vodorovně */
.tscroll { overflow-x: auto; max-width: 100%; }
.tscroll table.t { min-width: 520px; }

</style>
</head>

<header class="top no-print">
    <div class="top-in">
      <div class="brand">
        <span class="logo">🏰</span>
        <div>Village Planner<small>Clash of Clans — analýza a plán postupu</small></div>

  </header>

  <main class="wrap">

/* =========================================================================
 * catalog.js — přístup k vygenerovaným herním datům (gamedata-generated.js)
 *
 * Formát jedné položky:
 *   { n: jméno, c: kategorie, v: "home"|"builder",
 *     L: [[požadovaný TH/BH, cena, index suroviny, sekundy], ...]  index = úroveň-1
 *     A: [[TH, počet kusů], ...] — jen tam, kde se počet mění }
 * ========================================================================= */
(function (global) {
  "use strict";

  var COC = global.COC = global.COC || {};
  var G = global.COC_GAMEDATA || { items: {}, resources: [], maxTH: 17, maxBH: 10 };

  var byName = {};
  for (var id in G.items) {
    if (!Object.prototype.hasOwnProperty.call(G.items, id)) continue;
    var it = G.items[id];
    // Jméno může být sdílené mezi vesnicemi (Cannon vs. builder base) —
    // klíčujeme proto jménem i vesnicí a zvlášť držíme "první vyhrává".
    var key = it.n.toLowerCase();
    if (!byName[key]) byName[key] = Number(id);
    byName[key + "|" + it.v] = Number(id);
  }

  function item(dataId) { return G.items[String(dataId)] || null; }

  function idByName(name, village) {
    if (!name) return null;
    var key = String(name).toLowerCase();
    if (village && byName[key + "|" + village]) return byName[key + "|" + village];
    return byName[key] || null;
  }

  function nameOf(dataId) {
    var it = item(dataId);
    return it ? it.n : null;
  }

  function maxLevelOf(dataId) {
    var it = item(dataId);
    return it ? it.L.length : 0;
  }

  /* Nejvyšší úroveň dosažitelná na daném Town Hallu (u builder base na BH). */
  function capAtHall(dataId, hall) {
    var it = item(dataId);
    if (!it) return null;
    var cap = 0;
    for (var i = 0; i < it.L.length; i++) {
      if (it.L[i][0] <= hall) cap = i + 1;
    }
    return cap;
  }

  /* Kolik kusů dané budovy lze na daném hallu mít (TH, u builder base BH).
     Pro jednotky vrací 1. */
  function countAtHall(dataId, hall) {
    var it = item(dataId);
    if (!it) return 1;
    if (!it.A) return 1;
    var count = 0;
    for (var i = 0; i < it.A.length; i++) {
      if (it.A[i][0] <= hall) count = it.A[i][1];
    }
    return count;
  }

  function hasCounts(dataId) {
    var it = item(dataId);
    return !!(it && it.A);
  }

  /* Cena a čas jedné konkrétní úrovně. */
  function levelCost(dataId, level) {
    var it = item(dataId);
    if (!it || level < 1 || level > it.L.length) return null;
    var row = it.L[level - 1];
    return { cost: row[1], resource: G.resources[row[2]] || "?", seconds: row[3], hall: row[0] };
  }

  /* Součet ceny a času za upgrade z `from` na `to` (obojí včetně cílové úrovně). */
  function costBetween(dataId, from, to) {
    var totals = {};
    var seconds = 0;
    for (var lvl = from + 1; lvl <= to; lvl++) {
      var c = levelCost(dataId, lvl);
      if (!c) continue;
      totals[c.resource] = (totals[c.resource] || 0) + c.cost;
      seconds += c.seconds;
    }
    return { byResource: totals, seconds: seconds };
  }

    var it = item(dataId);
    return it && it.L.length ? it.L[0][0] : null;
  }

    hasCounts: hasCounts,
    levelCost: levelCost,
    costBetween: costBetween,
    unlockHall: unlockHall

/* =========================================================================
 * caps.js — kolik může být daná položka maximálně na daném Town Hallu
 *
 * Zdroje stropu (v tomhle pořadí priority):
 *   1) override — ruční tabulka od uživatele (záložka "Data")
 *   2) catalog  — vygenerovaná herní data (přesné, včetně cen a časů)
 *   3) hero     — záložní zabudovaná tabulka hrdinů
 *   4) learned  — naučeno z importovaných vesnic (pozorovaná maxima)
 *   5) estimate — odhad z maxLevel a podílu dostupného na daném TH
 *
 * Body 3–5 se uplatní jen u položek, které v herních datech nejsou
 * (typicky když Supercell přidá něco nového dřív, než se aktualizuje balík).
 * ========================================================================= */
(function (global) {
  "use strict";

  var COC = global.COC = global.COC || {};
  var D = global.COC_DATA;

  var LS_LEARNED = "coc-planner-learned-v1";
  var LS_OVERRIDE = "coc-planner-override-v1";

  var learned = load(LS_LEARNED) || {};    // { jméno: { th: pozorované maximum } }
  var overrides = load(LS_OVERRIDE) || {}; // { jméno: [th1..thN] } nebo { jméno: { th: strop } }

  function load(key) {
    try {
      var raw = global.localStorage && global.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function save(key, value) {
    try {
      if (global.localStorage) global.localStorage.setItem(key, JSON.stringify(value));
    } catch (e) { /* soukromý režim prohlížeče – prostě neukládáme */ }
  }

  function overrideCap(name, hall) {
    var row = overrides[name];
    if (!row) return null;
    if (Object.prototype.toString.call(row) === "[object Array]") {
      var v = row[hall - 1];
      return typeof v === "number" && v > 0 ? v : null;
    }
    var best = null;
    for (var key in row) {
      if (!Object.prototype.hasOwnProperty.call(row, key)) continue;
      var k = Number(key);
      if (k <= hall && (best === null || k > best)) best = k;
    }
    return best === null ? null : Number(row[String(best)]) || null;
  }

  function learnedCap(name, hall) {
    var row = learned[name];
    if (!row) return null;
    var best = null;
    for (var key in row) {
      if (!Object.prototype.hasOwnProperty.call(row, key)) continue;
      if (Number(key) <= hall) {
        var val = Number(row[key]);
        if (best === null || val > best) best = val;
      }

    return best;
  }

  function mk(cap, source, confident) {
    return { cap: Math.max(0, Math.round(cap || 0)), source: source, confident: !!confident };
  }

  /* Hlavní funkce.
     `unit` = normalizovaná položka, `hall` = úroveň TH (u builder base BH). */
  function capFor(unit, hall) {
    var ov = overrideCap(unit.name, hall);
    if (ov) return mk(ov, "override", true);

    if (unit.dataId && COC.catalog.available) {
      var exact = COC.catalog.capAtHall(unit.dataId, hall);
      if (exact !== null) return mk(exact, "catalog", true);
    }

    if (unit.category === "hero") {
      var hc = D.heroCap(unit.name, hall);
      if (hc) return mk(unit.maxLevel ? Math.min(hc, unit.maxLevel) : hc, "hero", true);
    }

    var lc = learnedCap(unit.name, hall);
    var est = estimate(unit, hall);
    if (lc && lc >= est) return mk(lc, "learned", true);
    return mk(est, "estimate", false);
  }

  function estimate(unit, hall) {
    var globalMax = unit.maxLevel || 0;
    if (!globalMax) return unit.level || 0;

    if (unit.category === "hero") {
      var hc = D.heroCap(unit.name, hall);
      if (hc) return Math.min(hc, globalMax);
    }

    var unlock = D.unlockTH(unit.name, unit.category);
    if (unlock && hall < unlock) return unit.level || 0;

    var est = Math.round(globalMax * D.fractionSinceUnlock(hall, unlock));
    if (est > globalMax) est = globalMax;
    if (est < unit.level) est = unit.level;
    if (est < 1 && unit.level > 0) est = unit.level;
    return est;
  }

  /* Naučí se stropy z pozorovaných vesnic: hráč na TH t s jednotkou na
     úrovni L dokazuje, že strop na TH t je aspoň L. */
  function learnFrom(villages) {
    var added = 0;
    for (var i = 0; i < villages.length; i++) {
      var v = villages[i];
      var th = v.th;
      if (!th) continue;
      for (var j = 0; j < v.units.length; j++) {
        var u = v.units[j];
        if (u.isSuper || !u.level) continue;
        if (D.isBuilderCategory(u.category)) continue;   // builder base má vlastní hall
        var row = learned[u.name] || (learned[u.name] = {});
        var key = String(th);
        if (!row[key] || row[key] < u.level) { row[key] = u.level; added++; }
      }
    }
    if (added) save(LS_LEARNED, learned);
    return added;
  }

  function setOverrides(obj) {
    overrides = obj && typeof obj === "object" ? obj : {};
    save(LS_OVERRIDE, overrides);
  }

  COC.caps = {
    capFor: capFor,
    learnFrom: learnFrom,
    setOverrides: setOverrides,
    getOverrides: function () { return overrides; },
    getLearned: function () { return learned; },
    resetLearned: function () { learned = {}; save(LS_LEARNED, learned); },
    resetOverrides: function () { overrides = {}; save(LS_OVERRIDE, overrides); }

/* ---------- js/parse.js ---------- */
/* =========================================================================
 * parse.js — načtení a normalizace JSON dat vesnice
 *
 * Podporované vstupy:
 *   A) Oficiální JSON hráče z Clash of Clans API (/players/%23TAG)
 *   B) Export z herního klienta — číselná `data` ID, obsahuje navíc budovy,
 *      zdi, pasti a celý Builder Base
 *   C) Pole nebo { "items": [...] } s libovolným z výše uvedených
 *
 * Výstup je pro obě varianty stejný: seznam položek `units`, kde každá má
 * jméno, kategorii, součet úrovní a počet kusů (u budov).
 * ========================================================================= */
(function (global) {
  "use strict";

  var COC = global.COC = global.COC || {};
  var D = global.COC_DATA;

  var TOWN_HALL_ID = 1000001;
  var BUILDER_HALL_ID = 1000034;

  /* ---------------------------------------------------------------- A/C */

  var DEFENSE_HINTS = [
    "Cannon", "Archer Tower", "Mortar", "Air Defense", "Wizard Tower",
    "Air Sweeper", "Hidden Tesla", "Bomb Tower", "X-Bow", "Inferno Tower",
    "Eagle Artillery", "Scattershot", "Spell Tower", "Monolith",
    "Multi-Archer Tower", "Ricochet Cannon", "Firespitter", "Multi-Gear Tower"
  ];

  function isDefenseName(name) {
    for (var i = 0; i < DEFENSE_HINTS.length; i++) {
      if (name.indexOf(DEFENSE_HINTS[i]) !== -1) return true;
    }
    return false;
  }

  function classifyByName(entry, source) {
    var name = entry.name || "";
    if (source === "hero") return "hero";
    if (source === "equipment") return "equipment";
    if (entry.village === "builderBase") return "builder";
    if (source === "spell") return D.isDarkSpell(name) ? "darkSpell" : "spell";
    if (D.isPet(name)) return "pet";
    if (D.isSiege(name)) return "siege";
    if (D.isDarkTroop(name)) return "darkTroop";
    return "elixirTroop";
  }

  function makeUnit(o) {
    return {
      dataId: o.dataId || null,
      name: o.name,
      level: o.level || 0,          // u budov součet úrovní všech kusů
      count: o.count || 1,
      instances: o.instances || [[o.level || 0, 1]],
      maxLevel: o.maxLevel || 0,
      category: o.category,
      village: o.village || "home",
      isSuper: !!o.isSuper,
      equipped: !!o.equipped,
      upgrading: o.upgrading || 0
    };
  }

  function pushApiUnits(target, arr, source) {
    if (!arr || !arr.length) return;
    for (var i = 0; i < arr.length; i++) {
      var e = arr[i];
      if (!e || typeof e.name !== "string") continue;
      var category = classifyByName(e, source);
      var dataId = COC.catalog.idByName(e.name, e.village === "builderBase" ? "builder" : "home");
      target.push(makeUnit({
        dataId: dataId,
        name: e.name,
        level: Number(e.level) || 0,
        maxLevel: Number(e.maxLevel) || 0,
        category: category,
        village: e.village === "builderBase" ? "builder" : "home",
        isSuper: D.isSuperTroop(e.name),
        equipped: !!e.equipped
      }));
    }
  }

  /* Nepovinné rozšíření oficiálního formátu: ručně dopsané budovy. */
  function pushExtraBuildings(target, input) {
    if (!input) return;

    function add(name, level, count, maxLevel) {
      if (!name) return;
      var lvl = Number(level) || 0;
      var cnt = Number(count) || 1;
      var lower = String(name).toLowerCase();
      var category = lower.indexOf("wall") === 0 ? "wall" : (isDefenseName(name) ? "defense" : "other");
      target.push(makeUnit({
        dataId: COC.catalog.idByName(name, "home"),
        name: name,
        level: lvl * cnt,
        count: cnt,
        instances: [[lvl, cnt]],
        maxLevel: Number(maxLevel) || 0,
        category: category
      }));
    }

    if (Object.prototype.toString.call(input) === "[object Array]") {
      for (var i = 0; i < input.length; i++) {
        var b = input[i];
        if (!b) continue;
        if (b.levels && b.levels.length) {
          for (var j = 0; j < b.levels.length; j++) add(b.name, b.levels[j], 1, b.maxLevel);
        } else {
          add(b.name, b.level, b.count, b.maxLevel);
        }
      }
      return;
    }

    for (var key in input) {
      if (!Object.prototype.hasOwnProperty.call(input, key)) continue;
      var v = input[key];
      if (Object.prototype.toString.call(v) === "[object Array]") {
        for (var k = 0; k < v.length; k++) add(key, v[k], 1, 0);
      } else if (v && typeof v === "object") {
        add(key, v.level, v.count, v.maxLevel);
      } else {
        add(key, v, 1, 0);
      }
    }
  }

  function normalizeApiPlayer(p) {
    var units = [];
    pushApiUnits(units, p.heroes, "hero");
    pushApiUnits(units, p.heroEquipment, "equipment");
    pushApiUnits(units, p.troops, "troop");
    pushApiUnits(units, p.spells, "spell");
    pushExtraBuildings(units, p.buildings || (p.village && p.village.buildings) || p.defenses);

    return {
      raw: p,
      format: "api",
      tag: p.tag || "",
      name: p.name || "Neznámý hráč",
      th: Number(p.townHallLevel) || 0,
      thWeapon: Number(p.townHallWeaponLevel) || 0,
      bh: Number(p.builderHallLevel) || 0,
      expLevel: Number(p.expLevel) || 0,
      trophies: Number(p.trophies) || 0,
      bestTrophies: Number(p.bestTrophies) || 0,
      builderTrophies: Number(p.builderBaseTrophies) || 0,
      warStars: Number(p.warStars) || 0,
      attackWins: Number(p.attackWins) || 0,
      defenseWins: Number(p.defenseWins) || 0,
      donations: Number(p.donations) || 0,
      donationsReceived: Number(p.donationsReceived) || 0,
      capitalContributions: Number(p.clanCapitalContributions) || 0,
      role: p.role || "",
      warPreference: p.warPreference || "",
      clan: p.clan ? { name: p.clan.name, tag: p.clan.tag, level: p.clan.clanLevel } : null,
      league: p.league ? p.league.name : "",
      labels: (p.labels || []).map(function (l) { return l.name; }),
      achievements: p.achievements || [],
      units: units,
      hasBuildings: units.some(function (u) { return u.category === "defense" || u.category === "wall"; })
    };
  }

  /* ------------------------------------------------------------------ B */

  /* Klíče exportu a vesnice, do které patří. */
  var EXPORT_GROUPS = [
    ["buildings", "home"], ["traps", "home"],
    ["units", "home"], ["spells", "home"], ["heroes", "home"],
    ["siege_machines", "home"], ["pets", "home"], ["equipment", "home"],
    ["helpers", "home"],
    ["buildings2", "builder"], ["traps2", "builder"],
    ["units2", "builder"], ["heroes2", "builder"]
  ];

  function looksLikeExport(o) {
    if (!o || typeof o !== "object") return false;
    var arr = o.buildings;
    if (Object.prototype.toString.call(arr) !== "[object Array]" || !arr.length) return false;
    return typeof arr[0].data === "number";
  }

  function hallLevel(list, wantedId) {
    if (!list) return 0;
    for (var i = 0; i < list.length; i++) {
      if (list[i].data === wantedId) return Number(list[i].lvl) || 0;
    }
    return 0;
  }

  function normalizeExport(p) {
    var th = hallLevel(p.buildings, TOWN_HALL_ID);
    var bh = hallLevel(p.buildings2, BUILDER_HALL_ID);
    var thWeapon = 0;

    // Nejdřív posbíráme syrové položky, pak je sloučíme podle dataId.
    var groups = {};
    var unknown = {};

    for (var g = 0; g < EXPORT_GROUPS.length; g++) {
      var key = EXPORT_GROUPS[g][0];
      var village = EXPORT_GROUPS[g][1];
      var list = p[key];
      if (Object.prototype.toString.call(list) !== "[object Array]") continue;

      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e || typeof e.data !== "number") continue;
        if (e.lvl === undefined) continue;    // např. craftovaná obrana bez úrovně

        if (e.data === TOWN_HALL_ID && e.weapon) thWeapon = Number(e.weapon) || 0;

        var info = COC.catalog.item(e.data);
        var groupKey = village + ":" + e.data;
        var entry = groups[groupKey];
        if (!entry) {
          entry = groups[groupKey] = {
            dataId: e.data,
            name: info ? info.n : ("Neznámé #" + e.data),
            category: info ? info.c : (village === "builder" ? "builderOther" : "other"),
            village: village,
            level: 0,
            count: 0,
            instances: [],
            upgrading: 0,
            maxLevel: info ? info.L.length : 0
          };
          if (!info) unknown[e.data] = true;
        }

        var cnt = Number(e.cnt) || 1;
        var lvl = Number(e.lvl) || 0;
        entry.count += cnt;
        entry.level += lvl * cnt;
        entry.instances.push([lvl, cnt]);
        if (e.timer) entry.upgrading += cnt;
      }
    }

    var units = [];
    for (var k in groups) {
      if (Object.prototype.hasOwnProperty.call(groups, k)) units.push(makeUnit(groups[k]));
    }

    return {
      raw: p,
      format: "export",
      tag: p.tag || "",
      name: p.name || "Moje vesnice",
      th: th,
      thWeapon: thWeapon,
      bh: bh,
      expLevel: 0, trophies: 0, bestTrophies: 0, builderTrophies: 0,
      warStars: 0, attackWins: 0, defenseWins: 0,
      donations: 0, donationsReceived: 0, capitalContributions: 0,
      role: "", warPreference: "", clan: null, league: "",
      labels: [], achievements: [],
      exportedAt: p.timestamp ? new Date(p.timestamp * 1000) : null,
      units: units,
      unknownIds: Object.keys(unknown).map(Number),
      hasBuildings: true
    };
  }

  /* ------------------------------------------------------------ společné */

  function looksLikeApiPlayer(o) {
    return !!o && typeof o === "object" &&
      (o.townHallLevel !== undefined || o.troops !== undefined || o.heroes !== undefined);
  }

  function parseInput(text) {
    var data;
    try {
      data = JSON.parse(text);
    } catch (err) {
      throw new Error("JSON se nepodařilo načíst: " + err.message);
    }
    return fromObject(data);
  }

  function fromObject(data) {
    var warnings = [];
    var list;

    if (Object.prototype.toString.call(data) === "[object Array]") list = data;
    else if (data && Object.prototype.toString.call(data.items) === "[object Array]") list = data.items;
    else if (data && Object.prototype.toString.call(data.players) === "[object Array]") list = data.players;
    else list = [data];

    var villages = [];
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      var v = null;

      if (looksLikeExport(o)) v = normalizeExport(o);
      else if (looksLikeApiPlayer(o)) v = normalizeApiPlayer(o);

      if (!v) {
        warnings.push("Položka #" + (i + 1) + " není rozpoznaný formát (chybí townHallLevel/troops/heroes " +
          "i pole buildings s číselnými ID) – přeskočeno.");
        continue;
      }

      if (!v.th) warnings.push("Vesnice „" + v.name + "“ nemá rozpoznaný Town Hall – analýza bude nepřesná.");
      if (!v.units.length) warnings.push("Vesnice „" + v.name + "“ neobsahuje žádné položky.");
      if (v.unknownIds && v.unknownIds.length) {
        warnings.push("Neznámá herní ID (" + v.unknownIds.length + "): " + v.unknownIds.slice(0, 8).join(", ") +
          (v.unknownIds.length > 8 ? " …" : "") + ". Nejspíš novinka, kterou zabudovaná herní data ještě neznají — " +
          "do analýzy se nezapočítají.");
      }
      villages.push(v);
    }

    if (!villages.length) {
      throw new Error("V datech nebyla nalezena žádná vesnice. Očekává se JSON z /players/{tag}, " +
        "export z herního klienta, nebo pole takových objektů.");
    }
    return { villages: villages, warnings: warnings };
  }

  COC.parse = {
    parseInput: parseInput,
    fromObject: fromObject,
    looksLikeExport: looksLikeExport,
    isDefenseName: isDefenseName
  };
})(window);

/* ---------- js/analyze.js ---------- */
/* =========================================================================
 * analyze.js — rozbor vesnice
 *
 * Klíčová myšlenka analýzy rushe:
 *   Nerushnutá vesnice na TH N má hotové (aspoň) všechno, co šlo udělat
 *   na TH N-1. Proto se všechno počítá dvakrát:
 *     - "current"    = postup vůči stropu aktuálního TH
 *     - "foundation" = postup vůči stropu předchozího TH  -> míra rushe
 *
 * Budovy se počítají po typech: úroveň = součet úrovní všech kusů, strop =
 * strop jednoho kusu krát počet, který na daném TH můžeš mít. Nepostavená
 * budova tak přirozeně vyjde jako chybějící úrovně.
 * ========================================================================= */
(function (global) {
  "use strict";

  var COC = global.COC = global.COC || {};
  var D = global.COC_DATA;

  /* Váhy kategorií při výpočtu celkového skóre rushe. */
  var RUSH_WEIGHTS = {
    hero: 3.0,
    // Vybavení hrdinů se platí rudou z hvězdného bonusu, ne surovinami vesnice,
    // a nedá se "zameškat" jako budova — do míry rushe se proto nepočítá.
    pet: 0.8,
    elixirTroop: 1.2,
    darkTroop: 1.2,
    spell: 1.0,
    darkSpell: 0.8,
    siege: 0.5,
    defense: 2.0,
    trap: 0.5,
    wall: 0.8,
    resource: 0.6,
    army: 0.9,
    other: 0.2,
    helper: 0.2,
    townhall: 0
    // Builder Base se do rushe hlavní vesnice nepočítá vůbec.
  };

  var LAB_CATEGORIES = ["elixirTroop", "darkTroop", "spell", "darkSpell", "siege"];
  var DEFENCE_CATEGORIES = ["defense", "trap", "wall"];

  function pct(a, b) { return b > 0 ? Math.max(0, Math.min(100, (a / b) * 100)) : 0; }
  function inList(list, x) { return list.indexOf(x) !== -1; }

  function hallFor(village, category) {
    return D.isBuilderCategory(category) ? (village.bh || 0) : (village.th || 1);
  }

  function expectedCount(unit, hall) {
    var fromCatalog = unit.dataId ? COC.catalog.countAtHall(unit.dataId, hall) : 1;
    if (!fromCatalog) fromCatalog = 0;
    return Math.max(fromCatalog, unit.count || 1);
  }

  function analyzeUnits(village) {
    var out = [];
    var locked = [];

    for (var i = 0; i < village.units.length; i++) {
      var u = village.units[i];
      if (u.isSuper) continue;            // super troops kopírují základní jednotku
      if (u.category === "townhall") continue;

      var hall = hallFor(village, u.category);
      var prevHall = Math.max(1, hall - 1);

      var cur = COC.caps.capFor(u, hall);
      var prev = COC.caps.capFor(u, prevHall);

      // Na tomhle hallu ještě není dostupné a hráč to nemá -> do postupu nepatří.
      if (!cur.cap && !u.level) {
        locked.push({
          name: u.name, category: u.category,
          unlockTH: u.dataId ? COC.catalog.unlockHall(u.dataId) : D.unlockTH(u.name, u.category)
        });
        continue;
      }

      var count = expectedCount(u, hall);
      var prevCount = u.dataId ? Math.min(count, COC.catalog.countAtHall(u.dataId, prevHall) || count) : count;

      var capPerUnit = Math.max(cur.cap, 0);
      var capSum = Math.max(capPerUnit * count, u.level);
      var foundationCapSum = Math.min(Math.max(prev.cap, 0) * prevCount, capSum);
      // Vybavení nejde "zameškat" — vypadne z hlášení dluhů.
      if (u.category === "equipment") foundationCapSum = Math.min(u.level, capSum);

      out.push({
        name: u.name,
        dataId: u.dataId,
        category: u.category,
        village: u.village,
        level: u.level,
        count: u.count || 1,
        expectedCount: count,
        missingCount: Math.max(0, count - (u.count || 1)),
        instances: u.instances,
        upgrading: u.upgrading || 0,
        capPerUnit: capPerUnit,
        cap: capSum,
        capSource: cur.source,
        confident: cur.confident,
        foundationCap: foundationCapSum,
        remaining: Math.max(0, capSum - u.level),
        foundationRemaining: Math.max(0, foundationCapSum - u.level),
        isBehind: u.level < foundationCapSum,
        pct: pct(u.level, capSum),
        foundationPct: pct(Math.min(u.level, foundationCapSum), foundationCapSum),
        role: D.roleOf(u.name),
        equipped: u.equipped,
        hall: hall
      });
    }

    out.sort(function (a, b) { return a.pct - b.pct; });
    locked.sort(function (a, b) { return (a.unlockTH || 0) - (b.unlockTH || 0); });
    return { units: out, locked: locked };
  }

  function groupByCategory(units) {
    var by = {};
    for (var i = 0; i < units.length; i++) {
      var u = units[i];
      var g = by[u.category] || (by[u.category] = {
        id: u.category,
        label: (D.categories[u.category] || {}).label || u.category,
        icon: (D.categories[u.category] || {}).icon || "•",
        items: [], level: 0, cap: 0, foundationLevel: 0, foundationCap: 0,
        remaining: 0, missingCount: 0, confidentCount: 0
      });
      g.items.push(u);
      g.level += u.level;
      g.cap += u.cap;
      g.foundationLevel += Math.min(u.level, u.foundationCap);
      g.foundationCap += u.foundationCap;
      g.remaining += u.remaining;
      g.missingCount += u.missingCount;
      if (u.confident) g.confidentCount++;
    }
    for (var key in by) {
      if (!Object.prototype.hasOwnProperty.call(by, key)) continue;
      var c = by[key];
      c.pct = pct(c.level, c.cap);
      c.foundationPct = pct(c.foundationLevel, c.foundationCap);
      c.confidence = c.items.length ? c.confidentCount / c.items.length : 0;
    }
    return by;
  }

  /* Souhrn přes kategorie. Procenta se počítají jako vážený průměr procent
     jednotlivých kategorií, ne jako podíl součtů — jinak by zdi (tisíce úrovní)
     přebily hrdiny i obranu dohromady. */
  function sumOver(units, categories, byCategory) {
    var level = 0, cap = 0, remaining = 0;
    var num = 0, den = 0;

    for (var i = 0; i < units.length; i++) {
      if (!inList(categories, units[i].category)) continue;
      level += units[i].level;
      cap += units[i].cap;
      remaining += units[i].remaining;
    }
    for (var c = 0; c < categories.length; c++) {
      var group = byCategory[categories[c]];
      if (!group || !group.cap) continue;
      var w = RUSH_WEIGHTS[categories[c]];
      if (w === undefined) w = 0.5;
      if (!w) continue;
      num += group.pct * w;
      den += w;
    }
    return {
      level: level, cap: cap, remaining: remaining,
      pct: den ? num / den : pct(level, cap)
    };
  }

  /* Vážený postup přes všechny kategorie hlavní vesnice. */
  function weightedProgress(byCategory) {
    var num = 0, den = 0;
    for (var key in byCategory) {
      if (!Object.prototype.hasOwnProperty.call(byCategory, key)) continue;
      var w = RUSH_WEIGHTS[key];
      if (w === undefined) w = 0.5;
      if (!w) continue;
      var c = byCategory[key];
      if (!c.cap) continue;
      num += c.pct * w;
      den += w;
    }
    return den ? num / den : 0;
  }

  function verdictFor(foundationPct) {
    if (foundationPct === null) return { key: "unknown", label: "Nelze určit", color: "info", text: "V datech není dost položek na to, aby šla míra rushe spočítat." };
    if (foundationPct >= 97) return { key: "clean",   label: "Čistá vesnice",     color: "good",  text: "Nic z předchozího Town Hallu nechybí. Klasický „max“ postup." };
    if (foundationPct >= 88) return { key: "light",   label: "Lehce rushnutá",    color: "okay",  text: "Pár drobností z minulého TH chybí, ale nic dramatického." };
    if (foundationPct >= 70) return { key: "rushed",  label: "Rushnutá",          color: "warn",  text: "Znatelný dluh z předchozího Town Hallu – vyplatí se ho dohnat." };
    if (foundationPct >= 45) return { key: "heavy",   label: "Silně rushnutá",    color: "bad",   text: "Velká část předchozího TH je nedodělaná. Útok i obrana za to platí." };
    return                          { key: "extreme", label: "Extrémně rushnutá", color: "bad",   text: "Vesnice je daleko před svým vývojem. Bez dohánění to nepůjde." };
  }

  function weightedFoundation(byCategory) {
    var num = 0, den = 0;
    for (var key in byCategory) {
      if (!Object.prototype.hasOwnProperty.call(byCategory, key)) continue;
      var w = RUSH_WEIGHTS[key];
      if (!w) continue;
      var c = byCategory[key];
      if (!c.foundationCap) continue;
      num += c.foundationPct * w;
      den += w;
    }
    return den ? num / den : null;
  }

  function heroSummary(units) {
    var heroes = units.filter(function (u) { return u.category === "hero"; });
    var lvl = 0, cap = 0;
    for (var i = 0; i < heroes.length; i++) { lvl += heroes[i].level; cap += heroes[i].cap; }
    return {

/* =========================================================================
 * planner.js — sestavení plánu postupu podle zvolené strategie
 *
 * Skóre jedné položky:
 *   score = váha kategorie
 *         * (0,5 + 0,5 * role jednotky ve zvolené strategii)
 *         * podíl chybějících úrovní
 *         * bonus za "dluh z minulého TH"
 *
 * Ceny a časy pocházejí z herních dat, takže nejde o odhady — u budov

(function (global) {
  "use strict";

  var COC = global.COC = global.COC || {};

  /* Kategorie, které staví stavitel (vs. laboratoř / kovárna). */

  var LAB_WORK = ["elixirTroop", "darkTroop", "spell", "darkSpell", "siege"];

  function workshopOf(category) {
    if (BUILDER_WORK.indexOf(category) !== -1) return "builder";
    if (LAB_WORK.indexOf(category) !== -1) return "lab";

    if (category === "equipment") return "forge";

    function add(fromLevel, times) {

      for (var r in c.byResource) {
        if (!Object.prototype.hasOwnProperty.call(c.byResource, r)) continue;
        byResource[r] = (byResource[r] || 0) + c.byResource[r] * times;

      seconds += c.seconds * times;

    var instances = u.instances && u.instances.length ? u.instances : [[u.level, 1]];
    for (var i = 0; i < instances.length; i++) {
      var lvl = instances[i][0];
      var cnt = instances[i][1] || 1;
      if (lvl < u.capPerUnit) add(lvl, cnt);
    }
    if (u.missingCount > 0) add(0, u.missingCount);   // ještě nepostavené kusy

    if (!known && !seconds) return null;

  function scoreItem(u, strategy) {

    var deficit = u.cap > 0 ? u.remaining / u.cap : 0;
    var foundationShare = u.remaining > 0 ? u.foundationRemaining / u.remaining : 0;
    var catchUp = 1 + strategy.foundationBonus * foundationShare;

    var score = catW * (0.5 + 0.5 * role) * deficit * catchUp;

    // hrdina, který ještě nikdy nebyl odemčený/upgradovaný, je absolutní priorita
    if (u.category === "hero" && u.level === 0 && u.cap > 0) score *= 1.6 + 1.2 * role;
    // vybavení hrdinů se platí rudou, ne stavitelem – levné body síly navíc
    if (u.category === "equipment") {
      if (u.equipped) score *= 1.25;
      // Kusů vybavení jsou desítky a rudy je málo; ty, do kterých hráč zatím
      // nic nedal, nemají zabírat první místa v plánu.

    if (u.isBehind) return "Dluh z TH" + Math.max(1, u.hall - 1) + ": chybí " + u.foundationRemaining + " úr. k tomu, co už dávno mohlo být hotové.";
    if (u.category === "hero") return "Hrdinové jsou u strategie „" + strategy.name + "“ nejvyšší priorita.";
    if (u.role[strategy.roleKey] >= 0.85) return "Nosná jednotka pro tenhle styl hraní.";
    if (u.expectedCount > 1) return "Zbývá " + u.remaining + " úr. napříč " + u.expectedCount + " kusy do stropu TH" + u.hall + ".";

  function buildItems(analysis, strategy) {

        category: u.category,
        level: u.level,
        cap: u.cap,
        capPerUnit: u.capPerUnit,
        count: u.count,
        expectedCount: u.expectedCount,
        missingCount: u.missingCount,
        instances: u.instances,
        upgrading: u.upgrading,
        remaining: u.remaining,
        foundationRemaining: u.foundationRemaining,
        isBehind: u.isBehind,
        confident: u.confident,
        capSource: u.capSource,
        pct: u.pct,
        role: u.role,
        equipped: u.equipped,

  /* Sečte ceny a časy skupiny položek. */
  function totalCost(items) {

    var byWorkshop = {};

    for (var i = 0; i < items.length; i++) {
      var c = items[i].cost;
      if (!c) continue;
      for (var r in c.byResource) {
        if (!Object.prototype.hasOwnProperty.call(c.byResource, r)) continue;

  }

  function buildPhases(items, strategy) {
    var phase1 = [], phase2 = [], phase3 = [];

    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.isBehind || it.missingCount > 0) phase1.push(it);
      else if (it.score >= 0.18 || it.category === "hero") phase2.push(it);
      else phase3.push(it);
    }

    var phases = [];
    if (phase1.length) {
      phases.push({
        id: "catchup",
        title: "Fáze 1 — dohnat základ",
        subtitle: "Věci, které už měly být hotové na předchozím Town Hallu, plus budovy, které vůbec nestojí. " +
          "Jsou levné, rychlé a dávají nejvíc síly za surovinu.",
        items: phase1
      });
    }
    phases.push({
      id: "core",
      title: (phase1.length ? "Fáze 2" : "Fáze 1") + " — jádro pro tenhle styl hraní",
      subtitle: "To, co u strategie „" + strategy.name + "“ rozhoduje o výsledku.",
      items: phase2
    });
    phases.push({
      id: "rest",
      title: (phase1.length ? "Fáze 3" : "Fáze 2") + " — dodělávky",
      subtitle: "Zbytek do plného stropu aktuálního TH. Dělej průběžně, až když je hotové výše uvedené.",
      items: phase3
    });

    for (var p = 0; p < phases.length; p++) phases[p].cost = totalCost(phases[p].items);
    return phases;
  }

  function thUpChecks(analysis, strategy) {
    var checks = [];
    var t = strategy.thUp;

    checks.push({
      label: "Hrdinové vůči stropu TH" + analysis.th,
      value: analysis.heroes.pct,
      target: t.heroPct,
      ok: analysis.heroes.pct >= t.heroPct
    });
    checks.push({
      label: "Laboratoř (vojska, kouzla, stroje)",
      value: analysis.labPct,
      target: t.labPct,
      ok: analysis.labPct >= t.labPct
    });
    if (analysis.rush.known) {
      checks.push({
        label: "Základ z předchozího TH",
        value: analysis.rush.foundationPct,
        target: t.foundationPct,
        ok: analysis.rush.foundationPct >= t.foundationPct
      });
    }
    if (analysis.hasDefenceData) {
      var target = Math.round(t.foundationPct * (strategy.categoryWeights.defense || 0.5));
      checks.push({
        label: "Obrana, pasti a zdi",
        value: analysis.defence.pct,
        target: target,
        ok: analysis.defence.pct >= target
      });
    }

    var failed = checks.filter(function (c) { return !c.ok; });
    return { checks: checks, ready: failed.length === 0, failed: failed };
  }

  function advice(analysis, strategy) {
    var out = [];
    var th = analysis.th;

    if (strategy.id === "strategic-rush") {
      if (analysis.heroes.pct < 35) {
        out.push({ level: "bad", text: "Tohle už není strategický rush, ale obyčejný rush. Hrdinové na " +
          Math.round(analysis.heroes.pct) + " % znamenají, že novým TH si jen přidáš další dluh. Zastav TH a dohoň hrdiny." });
      } else {
        out.push({ level: "good", text: "Držíš hrdiny nad hladinou — v tom je celý rozdíl mezi strategickým rushem a rozbitou vesnicí." });
      }
      out.push({ level: "info", text: "Doporučené pořadí stavitelů: 1) Laboratoř a Clan Castle, 2) skladiště, 3) armádní tábory, 4) až pak obrana." });
    }

    if (strategy.id === "max") {
      out.push({ level: "info", text: "Zbývá celkem " + analysis.totalRemaining + " úrovní do plného stropu TH" + th + "." });
      if (analysis.rush.known && analysis.rush.foundationPct < 99) {
        out.push({ level: "warn", text: "Max postup nejde dělat se starým dluhem — nejdřív dojeď " + analysis.behind.length + " položek z předchozího TH." });
      }
    }

    if (strategy.id === "war") {
      out.push({ level: analysis.war.score >= 70 ? "good" : "warn",
        text: "Válečná připravenost: " + Math.round(analysis.war.score) + " / 100 — " + analysis.war.label + "." });
      if (analysis.war.siegeCount === 0 && th >= 12) {
        out.push({ level: "bad", text: "Nemáš žádný obléhací stroj. Postav Workshop a rozjeď Wall Wrecker nebo Log Launcher jako první věc." });
      }
      var equip = analysis.byCategory.equipment;
      if (equip && equip.pct < 40) {
        out.push({ level: "warn", text: "Vybavení hrdinů je na " + Math.round(equip.pct) + " %. Ruda se nedá použít na nic jiného — je to nejlevnější síla, kterou máš." });
      }
    }

    if (strategy.id === "farm") {
      var aq = analysis.units.filter(function (u) { return u.name === "Archer Queen"; })[0];
      if (aq && aq.pct < 60) {
        out.push({ level: "warn", text: "Archer Queen na " + Math.round(aq.pct) + " % — pro farmení je to nejdůležitější jednotka ve hře, dej ji nahoru." });
      }
      var res = analysis.byCategory.resource;
      if (res && res.pct < 70) {
        out.push({ level: "warn", text: "Skladiště a sběrače jsou na " + Math.round(res.pct) + " %. Bez kapacity přicházíš o kořist z každého útoku." });
      }
    }

    if ((strategy.id === "push" || strategy.id === "defense") && !analysis.hasDefenceData) {
      out.push({ level: "warn", text: "Bez dat o budovách umím u téhle strategie hodnotit jen útočnou půlku." });
    }

    if (analysis.behind.length) {
      var top = analysis.behind.slice(0, 3).map(function (u) { return u.name + " (+" + u.foundationRemaining + ")"; });
      out.push({ level: "warn", text: "Největší dluhy z minulého TH: " + top.join(", ") + "." });
    }

    return out;
  }

  function queue(items, categories, limit) {
    return items.filter(function (i) { return categories.indexOf(i.category) !== -1; }).slice(0, limit || 10);
  }

  function build(analysis, strategy) {
    var items = buildItems(analysis, strategy);
    var effort = {};
    for (var i = 0; i < items.length; i++) {
      effort[items[i].category] = (effort[items[i].category] || 0) + items[i].remaining;
    }

    return {
      strategy: strategy,
      items: items,
      phases: buildPhases(items, strategy),
      thUp: thUpChecks(analysis, strategy),
      advice: advice(analysis, strategy),
      labQueue: queue(items, COC.analyze.LAB_CATEGORIES, 10),
      heroQueue: queue(items, ["hero"], 10),
      builderQueue: queue(items, BUILDER_WORK, 10),
      cost: totalCost(items),
      effort: effort,
      totalLevels: items.reduce(function (s, i) { return s + i.remaining; }, 0),
      topNext: items.slice(0, 6)
    };
  }

  COC.planner = { build: build, costOf: costOf, totalCost: totalCost, workshopOf: workshopOf };
})(window);

/* ---------- js/library.js ---------- */
/* =========================================================================
 * library.js — knihovna uložených vesnic
 *
 * Vesnice se ukládají do localStorage v syrové podobě (tak, jak přišly),
 * takže se dají kdykoliv znovu rozparsovat novější verzí aplikace.
 * Klíčem je vlastní id; tag slouží k rozpoznání, že jde o aktualizaci
 * už uložené vesnice.
 *
 * U každé vesnice se navíc drží historie: při každé aktualizaci se uloží
 * kompaktní otisk úrovní (jen čísla, ne celý JSON), ze kterého se pak dá
 * spočítat, co přesně se od minule posunulo.
 * ========================================================================= */
(function (global) {
  "use strict";

  var COC = global.COC = global.COC || {};
  var LS_KEY = "coc-planner-library-v1";
  var MAX_SNAPSHOTS = 12;
  var LS_ACTIVE = "coc-planner-active-v1";
  var LS_LEGACY = "coc-planner-last-json-v1";

  var entries = load();

  function load() {
    try {
      var raw = global.localStorage && global.localStorage.getItem(LS_KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      return Object.prototype.toString.call(parsed) === "[object Array]" ? parsed : [];
    } catch (e) { return []; }
  }

  function persist() {
    try {
      global.localStorage.setItem(LS_KEY, JSON.stringify(entries));
      return { ok: true };
    } catch (e) {
      // Typicky QuotaExceededError — localStorage má kolem 5 MB.
      return { ok: false, error: "Úložiště prohlížeče je plné. Smaž některé vesnice a zkus to znovu." };
    }
  }

  /* Kompaktní otisk vesnice: klíč -> [součet úrovní, počet kusů].
     Klíčem je herní dataId (číslo), u položek mimo herní data jméno. */
  function snapshotOf(village, analysis) {
    var levels = {};
    for (var i = 0; i < village.units.length; i++) {
      var u = village.units[i];
      if (u.isSuper) continue;
      var key = u.dataId ? String(u.dataId) : u.name;
      levels[key] = [u.level, u.count || 1];
    }
    return {
      at: Date.now(),
      th: village.th || 0,
      bh: village.bh || 0,
      levels: levels,
      summary: analysis ? {
        heroes: Math.round(analysis.heroes.pct),
        lab: Math.round(analysis.labPct),
        defence: analysis.hasDefenceData ? Math.round(analysis.defence.pct) : null,
        foundation: analysis.rush.known ? Math.round(analysis.rush.foundationPct) : null,
        progress: Math.round(analysis.thProgressPct),
        war: Math.round(analysis.war.score)
      } : null
    };
  }

  function sameLevels(a, b) {
    if (!a || !b) return false;
    var ka = Object.keys(a.levels), kb = Object.keys(b.levels);
    if (ka.length !== kb.length) return false;
    if (a.th !== b.th || a.bh !== b.bh) return false;
    for (var i = 0; i < ka.length; i++) {
      var x = a.levels[ka[i]], y = b.levels[ka[i]];
      if (!y || x[0] !== y[0] || x[1] !== y[1]) return false;
    }
    return true;
  }

  function nameForKey(key) {
    if (/^\d+$/.test(key)) {
      var n = COC.catalog.nameOf(Number(key));
      if (n) return n;
      return "Neznámé #" + key;
    }
    return key;
  }

  function categoryForKey(key) {
    if (/^\d+$/.test(key)) {
      var it = COC.catalog.item(Number(key));
      if (it) return it.c;
    }
    return "other";
  }

  /* Porovná dva otisky a vrátí, co se mezi nimi změnilo. */
  function diffSnapshots(older, newer) {
    if (!older || !newer) return null;
    var items = [];
    var built = [];

    for (var key in newer.levels) {
      if (!Object.prototype.hasOwnProperty.call(newer.levels, key)) continue;
      var to = newer.levels[key];
      var from = older.levels[key] || [0, 0];
      var dLevel = to[0] - from[0];
      var dCount = to[1] - from[1];
      if (!dLevel && !dCount) continue;
      var row = {
        key: key,
        name: nameForKey(key),
        category: categoryForKey(key),
        fromLevel: from[0], toLevel: to[0], deltaLevel: dLevel,
        fromCount: from[1], toCount: to[1], deltaCount: dCount
      };
      // Přistavěný kus se počítá i tehdy, když už nějaký kus toho typu stál.
      if (dCount > 0) built.push(row);
      items.push(row);
    }

    items.sort(function (a, b) { return b.deltaLevel - a.deltaLevel; });

    var gained = 0;
    for (var i = 0; i < items.length; i++) if (items[i].deltaLevel > 0) gained += items[i].deltaLevel;

    return {
      from: older, to: newer,
      days: Math.max(0, Math.round((newer.at - older.at) / 86400000)),
      items: items,
      built: built,
      gainedLevels: gained,
      thUp: newer.th - older.th,
      bhUp: newer.bh - older.bh,
      summaryDelta: (older.summary && newer.summary) ? {
        heroes: newer.summary.heroes - older.summary.heroes,
        lab: newer.summary.lab - older.summary.lab,
        defence: (newer.summary.defence !== null && older.summary.defence !== null)
          ? newer.summary.defence - older.summary.defence : null,
        foundation: (newer.summary.foundation !== null && older.summary.foundation !== null)
          ? newer.summary.foundation - older.summary.foundation : null,
        progress: newer.summary.progress - older.summary.progress,
        war: newer.summary.war - older.summary.war
      } : null
    };
  }

  /* Poslední změna u dané vesnice (nejnovější dva otisky). */
  function latestDiff(id) {
    var e = get(id);
    if (!e || !e.snapshots || e.snapshots.length < 2) return null;
    return diffSnapshots(e.snapshots[e.snapshots.length - 2], e.snapshots[e.snapshots.length - 1]);
  }

  /* Změna od úplně prvního otisku. */
  function totalDiff(id) {
    var e = get(id);
    if (!e || !e.snapshots || e.snapshots.length < 2) return null;
    return diffSnapshots(e.snapshots[0], e.snapshots[e.snapshots.length - 1]);
  }

  function newId() {
    return "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function labelFor(village, index) {
    if (village.name && village.name !== "Moje vesnice" && village.name !== "Neznámý hráč") return village.name;
    if (village.tag) return village.tag;
    return "Vesnice " + (index + 1);
  }

  /* Přidá jednu nebo víc vesnic ze syrového JSON objektu.
     Vrací { added, updated, error } — vesnice se stejným tagem se aktualizuje. */
  function addRaw(rawObject) {
    var parsed;
    try {
      parsed = COC.parse.fromObject(rawObject);
    } catch (err) {
      return { added: 0, updated: 0, unchanged: 0, error: err.message, warnings: [] };
    }

    var list = Object.prototype.toString.call(rawObject) === "[object Array]"
      ? rawObject
      : (rawObject && Object.prototype.toString.call(rawObject.items) === "[object Array]"
        ? rawObject.items
        : [rawObject]);

    var added = 0, updated = 0, unchanged = 0;

    for (var i = 0; i < parsed.villages.length; i++) {
      var v = parsed.villages[i];
      var analysis = null;
      try { analysis = COC.analyze.analyze(v); } catch (e) { /* otisk bude bez souhrnu */ }
      var snap = snapshotOf(v, analysis);
      // Syrová data téhle vesnice — parser zachovává pořadí vstupu.
      var raw = v.raw || list[i];
      var entry = {
        id: newId(),
        label: labelFor(v, entries.length + added),
        tag: v.tag || "",
        th: v.th || 0,
        bh: v.bh || 0,
        format: v.format,
        addedAt: Date.now(),
        updatedAt: Date.now(),
        raw: raw,
        snapshots: [snap]
      };

      var existing = v.tag ? findByTag(v.tag) : null;
      if (existing) {
        var history = existing.snapshots || [];
        var last = history[history.length - 1];

        // Stejná data podruhé nezakládají nový otisk — jen se posune čas.
        if (sameLevels(last, snap)) {
          existing.updatedAt = Date.now();
          existing.raw = raw;
          unchanged++;
        } else {
          history = history.concat([snap]);
          if (history.length > MAX_SNAPSHOTS) history = history.slice(history.length - MAX_SNAPSHOTS);
          entry.snapshots = history;
          entry.id = existing.id;
          entry.label = existing.label;
          entry.addedAt = existing.addedAt;
          entries[entries.indexOf(existing)] = entry;
          updated++;
        }
      } else {
        entries.push(entry);
        added++;
      }
    }

    var saved = persist();
    if (!saved.ok) {
      // Vrátíme knihovnu do stavu před uložením, ať UI neukazuje něco, co se neuložilo.
      entries = load();
      return { added: 0, updated: 0, unchanged: 0, error: saved.error, warnings: parsed.warnings };
    }
    return { added: added, updated: updated, unchanged: unchanged, error: null, warnings: parsed.warnings };
  }

  function findByTag(tag) {
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].tag && entries[i].tag === tag) return entries[i];
    }
    return null;
  }

  function get(id) {
    for (var i = 0; i < entries.length; i++) if (entries[i].id === id) return entries[i];
    return null;
  }

  function remove(id) {
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].id === id) { entries.splice(i, 1); break; }
    }
    persist();
    if (activeId() === id) setActive(entries.length ? entries[0].id : null);
  }

  function rename(id, label) {
    var e = get(id);
    if (!e) return;
    e.label = String(label || "").trim() || e.tag || "Vesnice";
    e.updatedAt = Date.now();
    persist();
  }

  function clear() {
    entries = [];
    persist();
    setActive(null);
  }

  function all() { return entries.slice(); }
  function count() { return entries.length; }

  function activeId() {
    try { return global.localStorage.getItem(LS_ACTIVE) || null; }
    catch (e) { return null; }
  }

  function setActive(id) {
    try {
      if (id) global.localStorage.setItem(LS_ACTIVE, id);
      else global.localStorage.removeItem(LS_ACTIVE);
    } catch (e) { /* ignore */ }
  }

  /* Přenese vesnici uloženou starší verzí aplikace do knihovny. */
  function migrateLegacy() {
    var raw;
    try { raw = global.localStorage.getItem(LS_LEGACY); } catch (e) { return 0; }
    if (!raw) return 0;
    var moved = 0;
    try {
      var res = addRaw(JSON.parse(raw));
      moved = res.added + res.updated;
    } catch (e) { /* nevadí, prostě se nepřenese */ }
    try { global.localStorage.removeItem(LS_LEGACY); } catch (e) { /* ignore */ }
    return moved;
  }

  /* Odhad zabraného místa, ať uživatel ví, na čem je. */
  function storageBytes() {
    try { return JSON.stringify(entries).length; } catch (e) { return 0; }
  }

  COC.library = {
    addRaw: addRaw,
    all: all,
    get: get,
    count: count,
    remove: remove,
    rename: rename,
    clear: clear,
    findByTag: findByTag,
    activeId: activeId,
    setActive: setActive,
    migrateLegacy: migrateLegacy,
    storageBytes: storageBytes,
    latestDiff: latestDiff,
    totalDiff: totalDiff,
    diffSnapshots: diffSnapshots,
    snapshotOf: snapshotOf
  };
})(window);

(function (global) {
  "use strict";

  var COC = global.COC = global.COC || {};
  var D = global.COC_DATA;

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function r(n) { return Math.round(Number(n) || 0); }
  function pctText(v) { return (v === null || v === undefined) ? "—" : r(v) + " %"; }
  function nf(n) { return (Number(n) || 0).toLocaleString("cs-CZ"); }

  /* 12 500 000 -> "12,5 M" */
  function short(n) {
    n = Number(n) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(1).replace(".", ",") + " mld";
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(".", ",") + " M";
    if (n >= 1e3) return Math.round(n / 1e3) + " k";
    return String(n);
  }

  /* 320000 s -> "3 d 16 h" */
  function duration(sec) {
    sec = Math.round(Number(sec) || 0);
    if (sec <= 0) return "—";
    var d = Math.floor(sec / 86400);
    var h = Math.floor((sec % 86400) / 3600);
    var m = Math.floor((sec % 3600) / 60);
    if (d >= 1) return d + " d" + (h ? " " + h + " h" : "");
    if (h >= 1) return h + " h" + (m ? " " + m + " min" : "");
    return m + " min";
  }

  var RES_SHORT = {
    "Gold": "zlato", "Elixir": "elixír", "Dark Elixir": "temný elixír",
    "Gold or Elixir": "zlato/elixír", "Ore": "ruda",
    "Shiny Ore": "lesklá ruda", "Glowy Ore": "zářivá ruda", "Starry Ore": "hvězdná ruda"
  };
  var WORKSHOP_LABEL = {
    builder: "stavitelé", lab: "laboratoř", hero: "hrdinové",
    forge: "kovárna", pet: "Pet House", other: "ostatní"
  };

  function costText(cost) {
    if (!cost) return "";
    var parts = [];
    for (var res in cost.byResource) {
      if (!Object.prototype.hasOwnProperty.call(cost.byResource, res)) continue;
      if (!cost.byResource[res]) continue;
      parts.push(short(cost.byResource[res]) + " " + (RES_SHORT[res] || res));
    }
    if (cost.seconds) parts.push("⏱ " + duration(cost.seconds));
    return parts.join(" · ");
  }

  function costSummary(cost) {
    if (!cost) return "";
    var h = '<div class="row small" style="gap:8px;margin-top:10px">';
    for (var res in cost.byResource) {
      if (!Object.prototype.hasOwnProperty.call(cost.byResource, res)) continue;
      if (!cost.byResource[res]) continue;
      h += '<span class="pill muted">' + esc(RES_SHORT[res] || res) + ' ' + short(cost.byResource[res]) + '</span>';
    }
    if (cost.byWorkshop) {
      for (var w in cost.byWorkshop) {
        if (!Object.prototype.hasOwnProperty.call(cost.byWorkshop, w)) continue;
        if (!cost.byWorkshop[w]) continue;
        h += '<span class="pill info">' + esc(WORKSHOP_LABEL[w] || w) + ' ' + duration(cost.byWorkshop[w]) + '</span>';
      }
    }
    h += '</div>';
    return h;
  }

  function colorFor(p) {
    if (p >= 90) return "good";
    if (p >= 70) return "okay";
    if (p >= 45) return "warn";
    return "bad";
  }

  function bar(p, cls) {
    var c = cls || colorFor(p);
    return '<div class="bar ' + c + '"><i style="width:' + Math.max(0, Math.min(100, p)) + '%"></i></div>';
  }

  function rowbar(label, value, pct, cls) {
    return '<div class="rowbar"><div class="lbl">' + esc(label) + '</div>' +
      '<div class="val">' + esc(value) + '</div>' + bar(pct, cls) + '</div>';
  }

  function stat(k, v, n) {

  }

  function catIcon(id) { return (D.categories[id] || {}).icon || "•"; }

  function countLabel(u) {
